<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>obrigado por existirem</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Playfair+Display:ital,wght@0,600;1,500&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--rosa:#fde8ed;--bege:#faf8f5;--verm:#d62839;--txt:#2b2b2b;--serif:'Playfair Display',Georgia,serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
/* fundo bege com grade rosa sutil */
body{background-color:var(--bege);color:var(--txt);font-family:Poppins,Inter,sans-serif;overflow:hidden;
 background-image:linear-gradient(rgba(214,40,57,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(214,40,57,.07) 1px,transparent 1px);background-size:28px 28px}
/* corações/estrelas flutuando ao fundo */
.deco{position:fixed;pointer-events:none;opacity:.55;z-index:1;animation:flut 7s ease-in-out infinite}
@keyframes flut{50%{transform:translateY(-16px) rotate(12deg)}}
.tela{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;transition:opacity 1.2s}
.tela.off{opacity:0;pointer-events:none}
h1{font:600 clamp(26px,7.5vw,38px)/1.2 var(--serif);color:var(--verm);margin:0;padding:4px 18px;text-align:center;background:linear-gradient(transparent 55%,var(--rosa) 55%)}
.sub{margin:0;font:italic 500 18px var(--serif);min-height:1em}
/* quebra-cabeça */
.stage{position:relative;transition:filter 1s}
.board{position:absolute;transition:opacity 1s}
.board svg,.pc svg{width:100%;height:100%;display:block}
.pc{position:absolute;left:0;top:0;z-index:3;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-user-drag:element;
 transition:transform .4s cubic-bezier(.3,1.5,.5,1);filter:drop-shadow(0 4px 6px rgba(120,0,20,.25))}
.pc.mv{transition:none;z-index:9;filter:drop-shadow(0 10px 12px rgba(120,0,20,.3))}
.pc.arr{opacity:.35}
.pc.ok{cursor:default;filter:none;z-index:2}
.stage.done{animation:beat 1.1s ease 2;filter:drop-shadow(0 0 18px rgba(214,40,57,.5))}
.board .fill,.board .molde{transition:opacity .6s}
.board .fill{opacity:0}
.stage.done .board .fill{opacity:1}
.stage.done .board .molde{opacity:0}
@keyframes beat{30%{transform:scale(1.08)}60%{transform:scale(1.02)}}
#cv{position:fixed;inset:0;pointer-events:none;z-index:20}
/* cartão das frases */
.card{position:relative;width:min(86vw,420px);padding:48px 28px;background:#fff;border:2px solid var(--rosa);border-radius:28px;
 box-shadow:0 10px 40px rgba(214,40,57,.12);text-align:center;opacity:0;transform:translateY(14px) scale(.97);transition:.6s}
.card.in{opacity:1;transform:none}
.card.gone{display:none}
.card p{margin:0;font:italic 500 clamp(24px,7vw,34px)/1.4 var(--serif)}
.card::before{content:"♥";position:absolute;left:-12px;top:-16px;font-size:40px;color:var(--verm);transform:rotate(-14deg)}
.card::after{content:"✦";position:absolute;right:-8px;bottom:-14px;font-size:30px;color:var(--verm)}
/* mural de Polaroids */
.mural{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:22px 8px;pointer-events:none}
.pol{margin:0;width:clamp(120px,38vw,170px);background:#fff;padding:8px 8px 2px;box-shadow:0 8px 22px rgba(0,0,0,.18);
 opacity:0;transform:rotate(var(--r)) translateY(40px) scale(.9);transition:1s cubic-bezier(.2,.9,.3,1.2)}
.mural.in .pol{opacity:1;transform:rotate(var(--r))}
.pol img{width:100%;aspect-ratio:1/1.1;object-fit:cover;display:block;background:var(--rosa)}
.pol figcaption{font:600 24px Caveat,cursive;text-align:center;padding:2px 0 4px}
/* botão de som */
#som{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;z-index:30;width:40px;height:40px;border:0;border-radius:50%;
 background:#fff;box-shadow:0 2px 10px rgba(214,40,57,.2);font-size:18px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.deco{animation:none}}
</style>
</head>
<body>

<button id="som" aria-label="Ligar ou desligar o som">🔊</button>
<canvas id="cv"></canvas>

<!-- ETAPA 1: quebra-cabeça -->
<section class="tela" id="t1">
  <div style="text-align:center">
    <h1>obrigado por existirem</h1>
    <p class="sub"></p><!-- subtítulo (vazio; escreva aqui se quiser) -->
  </div>
  <div class="stage" id="stage"><div class="board" id="board"></div></div>
</section>

<!-- ETAPA 2: frases + mural -->
<section class="tela off" id="t2">
  <div class="card" id="card"><p id="fala"></p></div>
  <div class="mural" id="mural"></div>
</section>

<script>
/* =====================================================
   ✏️ CONFIGURAÇÃO — é só mexer aqui
   ===================================================== */
const CONFIG = {
  musica: "gg.mp3",                           // arquivo na mesma pasta deste HTML
  fotos:  ["um.jpg","dois.jpg","tres.jpg"],   // suas 3 fotos (mesma pasta)
  legenda: "my girl",                         // legenda manuscrita das Polaroids
  letras: ["J","G","D","T"],                  // letras das 4 peças (topo-esq, topo-dir, baixo-esq, baixo-dir)
  // A música toca desde que o site abre (em loop). Se true, ela volta ao 0:00 quando os slides começam,
  // aí os tempos "t" abaixo batem exatamente com os segundos do mp3.
  reiniciarMusicaNosSlides: false,
  // t = segundos DEPOIS que os slides começam (logo após a chuva de pétalas) em que cada frase aparece.
  falas: [
    {t: 0,  txt: "You look so pretty and I love this view"},
    {t: 7,  txt: "We fell in love in October"},
    {t: 14, txt: "That's why I love fall"},
    {t: 21, txt: "Looking at the stars, Admiring from afar"},
    {t: 28, fotos: true}                      // mural final de fotos
  ]
};
// fotos de exemplo (aparecem só se um/dois/tres.jpg não existirem)
const PLACEHOLDER = [
  "https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=500&q=70",
  "https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=500&q=70",
  "https://images.unsplash.com/photo-1529634806980-85c3dd6d34ac?w=500&q=70"
];
const CORACAO_IMG = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#fde8ed"/><path d="M50 78C20 56 22 34 38 32c8-1 12 4 12 8 0-4 4-9 12-8 16 2 18 24-12 46z" fill="#d62839"/></svg>');

const $ = s => document.querySelector(s);

/* ---------- decoração flutuante ---------- */
for (let i = 0; i < 24; i++) {
  const d = document.createElement('span');
  d.className = 'deco';
  d.textContent = '♥✦★·'[i % 4];
  d.style.cssText = `left:${Math.random()*100}vw;top:${Math.random()*100}vh;font-size:${10+Math.random()*18}px;color:${i%3?'#f4a6b7':'#d62839'};animation-delay:-${Math.random()*7}s`;
  document.body.prepend(d);
}

/* =====================================================
   ÁUDIO (toca quando os slides começam; botão mute/unmute)
   ===================================================== */
const audio = new Audio(CONFIG.musica);
audio.loop = true;
let somIniciado = false;
// tenta tocar ao abrir; os navegadores costumam bloquear som sem interação,
// então, se bloquear, começa no primeiro toque/clique em qualquer lugar da página
const GESTOS = ['pointerdown','pointerup','mousedown','touchend','click','keydown'];
function tentarTocar() {
  audio.play().then(() => {
    somIniciado = true;
    GESTOS.forEach(ev => document.removeEventListener(ev, tentarTocar, true));
  }).catch(() => {});
}
GESTOS.forEach(ev => document.addEventListener(ev, tentarTocar, true));
tentarTocar();
$('#som').onclick = () => {
  audio.muted = !audio.muted;
  $('#som').textContent = audio.muted ? '🔇' : '🔊';
  if (somIniciado && audio.paused && !audio.ended) audio.play().catch(() => {});
};

/* =====================================================
   ETAPA 1 — QUEBRA-CABEÇA (coordenadas num quadro 200×200)
   ===================================================== */
const HEART = "M100 182C30 128 6 92 6 56C6 28 28 10 54 10C78 10 94 24 100 40C106 24 122 10 146 10C172 10 194 28 194 56C194 92 170 128 100 182Z";
// q = quadrante; add = "dentes" que a peça ganha; sub = encaixes que ela perde; l = centro visual da peça (onde a letra fica)
const PECAS = [
  {q:[0,0],    add:[[110,65],[44,110]],  sub:[],                   l:[56,58]},
  {q:[100,0],  add:[],                   sub:[[110,65],[150,90]],  l:[144,58]},
  {q:[0,100],  add:[],                   sub:[[44,110],[90,152]],  l:[73,128]},
  {q:[100,100],add:[[90,152],[150,90]],  sub:[],                   l:[127,128]}
];
const stage = $('#stage'), board = $('#board');
let S, PW, W, H;

// molde tracejado em formato de coração (grid 2x2)
// (o coração vermelho "fill" fica escondido por baixo e aparece ao completar, cobrindo qualquer fresta)
board.innerHTML = `<svg viewBox="0 0 200 200"><defs><clipPath id="hb"><path d="${HEART}"/></clipPath>
<radialGradient id="gb" gradientUnits="userSpaceOnUse" cx="70" cy="45" r="170"><stop offset="0" stop-color="#ee4256"/><stop offset="1" stop-color="#c41c2e"/></radialGradient></defs>
<g class="molde"><path d="${HEART}" fill="#f0ebe6" stroke="#b9a9a9" stroke-width="1.5" stroke-dasharray="5 4"/>
<g clip-path="url(#hb)" stroke="#b9a9a9" stroke-width="1.5" stroke-dasharray="5 4"><path d="M100 0V200M0 100H200"/></g></g>
<path class="fill" d="${HEART}" fill="url(#gb)"/></svg>`;

// SVG de uma peça: quadrante + dentes − encaixes, recortado no formato do coração
function svgPeca(p, i) {
  const c = (a, f) => a.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="12" fill="${f}"/>`).join('');
  return `<svg viewBox="${p.q[0]-26} ${p.q[1]-26} 152 152"><defs>
<clipPath id="h${i}"><path d="${HEART}"/></clipPath>
<mask id="m${i}" maskUnits="userSpaceOnUse" x="-20" y="-20" width="240" height="240"><rect x="${p.q[0]}" y="${p.q[1]}" width="100" height="100" fill="#fff"/>${c(p.add,'#fff')}${c(p.sub,'#000')}</mask>
<radialGradient id="g${i}" gradientUnits="userSpaceOnUse" cx="70" cy="45" r="170"><stop offset="0" stop-color="#ee4256"/><stop offset="1" stop-color="#c41c2e"/></radialGradient></defs>
<g clip-path="url(#h${i})"><rect x="-20" y="-20" width="240" height="240" fill="url(#g${i})" mask="url(#m${i})"/></g>
<text x="${p.l[0]}" y="${p.l[1]}" dy="${CONFIG.letras[i]==='J'?'.31':'.35'}em" text-anchor="middle" font-family="Playfair Display,Georgia,serif" font-size="30" font-weight="600" fill="#fff">${CONFIG.letras[i]}</text></svg>`;
}

const slots = [0,1,2,3].sort(() => Math.random() - .5);   // cantos onde as peças começam
const pcs = PECAS.map((d, i) => {
  const el = document.createElement('div');
  el.className = 'pc'; el.draggable = true; el.innerHTML = svgPeca(d, i);
  stage.appendChild(el);
  return {...d, i, el, ok:false, slot:slots[i], sr:[-12,9,-7,13][i], x:0, y:0, r:0, gx:0, gy:0};
});

const mover = p => p.el.style.transform = `translate(${p.x}px,${p.y}px) rotate(${p.r}deg)`;

// calcula tamanhos (responsivo) e posiciona as peças
function medir() {
  S = Math.min(280, innerWidth * .6, innerHeight * .32); PW = S * .76;   // 152/200: peça = quadrante + margem de 26 p/ os dentes
  W = Math.min(innerWidth, 520); H = S + PW * 1.5;
  stage.style.width = W + 'px'; stage.style.height = H + 'px';
  const bx = (W - S) / 2, by = (H - S) / 2;
  board.style.cssText = `width:${S}px;height:${S}px;left:${bx}px;top:${by}px`;
  pcs.forEach(p => {
    p.el.style.width = p.el.style.height = PW + 'px';
    p.hx = bx + (p.q[0] - 26) * S / 200; p.hy = by + (p.q[1] - 26) * S / 200;
    p.sx = (p.slot % 2) * (W - PW); p.sy = (p.slot >> 1) * (H - PW);
    if (p.ok) { p.x = p.hx; p.y = p.hy; p.r = 0; } else { p.x = p.sx; p.y = p.sy; p.r = p.sr; }
    mover(p);
  });
}

// solta a peça em (x,y): encaixa se estiver perto do lugar certo
function soltar(p, x, y) {
  p.x = Math.max(0, Math.min(W - PW, x)); p.y = Math.max(0, Math.min(H - PW, y));
  if (Math.hypot(p.x - p.hx, p.y - p.hy) < PW * .3) {
    Object.assign(p, {ok:true, x:p.hx, y:p.hy, r:0});
    p.el.classList.add('ok'); p.el.draggable = false;
    if (pcs.every(q => q.ok)) completo();
  } else {
    // caiu em cima do molde no lugar errado → volta para o canto
    const cx = p.x + PW / 2, cy = p.y + PW / 2, bx = (W - S) / 2, by = (H - S) / 2;
    if (cx > bx && cx < bx + S && cy > by && cy < by + S) Object.assign(p, {x:p.sx, y:p.sy, r:p.sr});
  }
  mover(p);
}

const pos = (cx, cy) => { const r = stage.getBoundingClientRect(); return [cx - r.left, cy - r.top]; };

pcs.forEach(p => {
  const el = p.el;
  /* --- Desktop: HTML5 Drag and Drop --- */
  el.addEventListener('dragstart', e => {
    const [x, y] = pos(e.clientX, e.clientY);
    p.gx = x - p.x; p.gy = y - p.y;
    e.dataTransfer.setData('text/plain', p.i); e.dataTransfer.effectAllowed = 'move';
    setTimeout(() => el.classList.add('arr'), 0);
  });
  el.addEventListener('dragend', () => el.classList.remove('arr'));
  /* --- Celular: eventos Touch --- */
  el.addEventListener('touchstart', e => {
    e.preventDefault();
    const [x, y] = pos(e.touches[0].clientX, e.touches[0].clientY);
    p.gx = x - p.x; p.gy = y - p.y; p.r = 0; el.classList.add('mv');
  }, {passive:false});
  el.addEventListener('touchmove', e => {
    e.preventDefault();
    const [x, y] = pos(e.touches[0].clientX, e.touches[0].clientY);
    p.x = x - p.gx; p.y = y - p.gy; mover(p);
  }, {passive:false});
  el.addEventListener('touchend', () => { el.classList.remove('mv'); soltar(p, p.x, p.y); });
});
// o "drop" vale na tela inteira
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  const p = pcs[+e.dataTransfer.getData('text/plain')]; if (!p || p.ok) return;
  const [x, y] = pos(e.clientX, e.clientY);
  p.el.classList.add('mv'); p.x = x - p.gx; p.y = y - p.gy; p.r = 0; mover(p);
  void p.el.offsetWidth; p.el.classList.remove('mv', 'arr');   // sem "voo" até o ponto do drop
  soltar(p, p.x, p.y);
});
addEventListener('resize', medir);
medir();

/* ---------- conclusão: pulso + chuva de pétalas ---------- */
function completo() {
  setTimeout(() => { stage.classList.add('done'); petalas(170); }, 400);
  setTimeout(() => { $('#t1').classList.add('off'); iniciarSlides(); }, 4300);
}

const cv = $('#cv'), g = cv.getContext('2d');
let ps = [], raf = 0;
function petalas(n) {
  cv.width = innerWidth; cv.height = innerHeight;
  const r = stage.getBoundingClientRect(), ox = r.left + r.width / 2, oy = r.top + r.height / 2;
  const nova = (x, y, vx, vy) => ({x, y, vx, vy, s:7 + Math.random()*10, a:Math.random()*6.3, va:(Math.random()-.5)*.2, ph:Math.random()*6, h:335 + Math.random()*22, l:78 + Math.random()*12});
  for (let i = 0; i < n; i++) {                    // explosão a partir do coração
    const a = Math.random() * 6.3, v = 3 + Math.random() * 9;
    ps.push(nova(ox, oy, Math.cos(a) * v, Math.sin(a) * v - 3));
  }
  for (let i = 0; i < n; i++)                      // chuva vinda do topo
    ps.push(nova(Math.random() * innerWidth, -Math.random() * innerHeight, 0, 1 + Math.random() * 2));
  if (!raf) loop();
}
function loop() {
  g.clearRect(0, 0, cv.width, cv.height);
  ps.forEach(p => {
    p.vx *= .97; p.vy = Math.min(p.vy + .06, 2.6);
    p.x += p.vx + Math.sin(p.ph += .03) * .8; p.y += p.vy; p.a += p.va;
    g.save(); g.translate(p.x, p.y); g.rotate(p.a);
    g.fillStyle = `hsl(${p.h} 85% ${p.l}%)`; g.beginPath();
    g.moveTo(0, -p.s); g.quadraticCurveTo(p.s*.9, -p.s*.3, 0, p.s); g.quadraticCurveTo(-p.s*.9, -p.s*.3, 0, -p.s);
    g.fill(); g.restore();
  });
  ps = ps.filter(p => p.y < cv.height + 30);
  raf = ps.length ? requestAnimationFrame(loop) : 0;
  if (!raf) g.clearRect(0, 0, cv.width, cv.height);
}

/* =====================================================
   ETAPA 2 — SLIDES sincronizados com a música
   ===================================================== */
const card = $('#card'), fala = $('#fala'), mural = $('#mural');

// monta as Polaroids (usa seus .png; se faltarem, cai nos placeholders)
CONFIG.fotos.forEach((src, i) => {
  const f = document.createElement('figure');
  f.className = 'pol'; f.style.setProperty('--r', [-7, 4, -3][i % 3] + 'deg'); f.style.transitionDelay = i * .6 + 's';
  f.innerHTML = `<img alt=""><figcaption>${CONFIG.legenda}</figcaption>`;
  const im = f.firstChild, reserva = [PLACEHOLDER[i % 3], CORACAO_IMG];
  im.onerror = () => reserva.length ? im.src = reserva.shift() : im.onerror = null;
  im.src = src; mural.appendChild(f);
});

function mostrar(f) {
  card.classList.remove('in');
  setTimeout(() => {
    if (f.fotos) { card.classList.add('gone'); mural.classList.add('in'); }
    else { fala.textContent = f.txt; card.classList.add('in'); }
  }, 550);
}

function iniciarSlides() {
  $('#t2').classList.remove('off');
  if (CONFIG.reiniciarMusicaNosSlides) audio.currentTime = 0;
  tentarTocar();
  const t0 = performance.now(); let atual = -1;
  (function tick() {
    const t = (performance.now() - t0) / 1000;   // segundos desde o início dos slides
    let k = -1; CONFIG.falas.forEach((f, i) => { if (t >= f.t) k = i; });
    if (k > atual) { atual = k; mostrar(CONFIG.falas[k]); }   // só avança, nunca volta
    if (atual < CONFIG.falas.length - 1) requestAnimationFrame(tick);
  })();
}
</script>
</body>
</html>
